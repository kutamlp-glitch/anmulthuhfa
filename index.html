<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>انمول تحفہ – Humsafar Urdu Class 5</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Malayalam:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d3a8a;--pencil:#ffc928;--paper:#fffdf3;--red:#e2453c;--green:#2e9e5b;--sky:#e6f0ff;--line:#c9d6f5}
@media(prefers-color-scheme:dark){:root{--paper:#1c2238;--sky:#26304f;--line:#3a4772;--ink:#cfe0ff}body{color:#f1f3ff!important}}
*{box-sizing:border-box}
body{margin:0;font-family:'Baloo 2','Noto Sans Malayalam',sans-serif;background:var(--sky);color:#222;font-size:18px;
background-image:repeating-linear-gradient(transparent 0 35px,var(--line) 35px 36px)}
.ur{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif;direction:rtl;line-height:2.1}
.ml{font-family:'Noto Sans Malayalam',sans-serif;font-size:.8em;opacity:.85}
header{background:var(--pencil);padding:10px 16px 0;border-bottom:6px solid var(--ink);text-align:center;position:relative}
header h1{margin:0;font-size:clamp(26px,6vw,44px);color:var(--ink)}
header p{margin:0 0 6px;font-size:14px}
#pencil{position:absolute;left:12px;top:8px;width:70px;transform:rotate(-20deg);animation:wob 2.4s ease-in-out 2}
@keyframes wob{50%{transform:rotate(10deg)}}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;justify-content:center;flex-wrap:wrap}
nav button{font:inherit;font-weight:800;border:3px solid var(--ink);border-bottom:none;border-radius:14px 14px 0 0;background:#fff;color:var(--ink);padding:6px 12px;cursor:pointer}
nav button[aria-selected=true]{background:var(--ink);color:#fff}
main{max-width:900px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;margin:12px 0;box-shadow:5px 5px 0 var(--ink)}
.btn{font:inherit;font-weight:800;font-size:18px;border:3px solid var(--ink);background:var(--pencil);color:#222;border-radius:30px;padding:8px 18px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.alt{background:#fff}.btn.sm{padding:3px 12px;font-size:15px}
:focus-visible{outline:4px solid var(--red);outline-offset:2px}
.line{display:flex;gap:10px;align-items:center;border-bottom:2px dashed var(--line);padding:6px 0;flex-wrap:wrap}
.line .txt{flex:1;min-width:220px}
.line .ur{font-size:24px;text-align:right}
.w{cursor:pointer;border-radius:8px;padding:0 2px}.w:hover,.w.k{background:#fff0a6;color:#222}
.w.gl{border-bottom:3px dotted var(--red)}
.title{font-size:clamp(34px,8vw,56px);text-align:center;color:var(--red);margin:0}
#pop{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:20px;padding:10px 18px;max-width:92vw;display:none;z-index:9;text-align:center;box-shadow:0 6px 20px #0006}
#pop .ur{font-size:26px;line-height:1.6}
#vn{font-size:14px;background:#fff3c4;color:#222;padding:6px 10px;border-radius:10px;margin:8px 0;display:none}
.bub{max-width:88%;padding:8px 14px;border-radius:18px;margin:8px 0;border:3px solid var(--ink)}
.bub.K{background:#d6f5df;margin-right:auto}.bub.G{background:#ffe9a8;margin-left:auto}
.bub.me{outline:4px solid var(--red);animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.03)}}
.who{font-weight:800;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;direction:rtl;text-align:center}
.cal .h{background:var(--red);color:#fff;border-radius:8px;font-family:'Noto Nastaliq Urdu';font-size:clamp(11px,2.8vw,17px);padding:4px 0}
.cal button{font:inherit;font-weight:800;aspect-ratio:1;border:2px solid var(--line);background:#fff;color:#222;border-radius:50%;cursor:pointer;font-size:clamp(14px,4vw,22px)}
.cal button.sun{color:var(--red)}.cal button.ring{border:3px solid var(--ink);background:#fff6c2}
.cal button.sel{background:var(--ink);color:#fff}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{font:inherit;font-size:22px;border:3px solid var(--ink);background:#fff;color:#222;border-radius:16px;padding:8px 14px;cursor:pointer;text-align:center}
.opt.ok{background:#b8f0c8;animation:hop .5s}.opt.no{background:#ffd0cc;animation:shake .4s}
@keyframes hop{50%{transform:translateY(-10px)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:2.6em;font-weight:800;margin-top:8px}
.bar{height:16px;background:#fff;border:3px solid var(--ink);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.face{width:84px;height:84px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-size:34px;font-weight:800;margin:0 auto 6px;color:#fff}
.stamp{border:4px dashed var(--ink);background:#fff;border-radius:6px;padding:10px;text-align:center;min-height:120px;display:grid;place-items:center;cursor:pointer}
.stamp.got{border-style:solid;background:#fff6c2;animation:hop .5s}
.pop{position:fixed;pointer-events:none;font-size:34px;animation:fly 1.2s forwards;z-index:10}
@keyframes fly{to{transform:translateY(-220px) rotate(40deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#pencil{display:none}@media(min-width:700px){#pencil{display:block}}
</style>
</head>
<body>
<header>
<svg id="pencil" viewBox="0 0 120 20" aria-hidden="true"><rect x="0" y="3" width="90" height="14" fill="#2e7de0"/><rect x="0" y="3" width="90" height="4" fill="#e2453c"/><polygon points="90,3 120,10 90,17" fill="#f5d9a8"/><polygon points="108,7 120,10 108,13" fill="#333"/></svg>
<h1 class="ur" style="line-height:1.6">انمول تحفہ</h1>
<p>Humsafar Urdu · Class 5 · Unit 2 · Lesson 4 · സബക് ۴ · പേജ് 66–74</p>
<nav role="tablist" id="nav"></nav>
</header>
<main>
<div id="vn"></div>

<section id="story"></section>
<section id="role"></section>
<section id="leaders"></section>
<section id="cal"></section>
<section id="num"></section>
<section id="quiz"></section>
</main>
<div id="pop" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
/* ---------- speech ---------- */
let voice=null;
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/^ur/i.test(x.lang))||v.find(x=>/^hi/i.test(x.lang))||null;
 const n=$('#vn');if(v.length&&!v.some(x=>/^ur/i.test(x.lang))){n.style.display='block';n.textContent='ℹ️ ഈ ഉപകരണത്തിൽ ഉർദു ശബ്ദം ഇല്ല. Settings → Language & input → Text-to-speech ൽ Urdu (Pakistan) ഇൻസ്റ്റാൾ ചെയ്യുക. (No Urdu voice found on this device; install "Urdu – Pakistan" in text-to-speech settings. Chrome / Edge / Android work best.)'}}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,rate=.8){return new Promise(r=>{if(!('speechSynthesis' in window))return r();speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t.replace(/[۔]/g,'،'));u.lang='ur-PK';if(voice)u.voice=voice;u.rate=rate;u.onend=r;u.onerror=r;speechSynthesis.speak(u)})}
const say2=say;
/* ---------- glossary ---------- */
const norm=w=>w.replace(/[\u064B-\u065F\u0670\u06D4!؟?،.:,"']/g,'');
const G={}; ("پنسل=പെൻസിൽ|تحفہ=സമ്മാനം|انمول=അമൂല്യമായ|دوست=സുഹൃത്ത്|تلاش=തിരച്ചിൽ|گم=നഷ്ടപ്പെട്ട|کتاب=പുസ്തകം|خوش=സന്തോഷം|قیمتی=വിലപ്പെട്ട|پریشانی=ആശങ്ക/വിഷമം|ٹیچر=അധ്യാപിക|بچّوں=കുട്ടികൾ|بچّے=കുട്ടി|بچّو=കുട്ടികളേ|پیار=സ്നേഹം|کہانی=കഥ|ملنے=കാണാൻ|خاص=പ്രത്യേകമായ|اندر=ഉള്ളിൽ|باپو=ബാപ്പു (ഗാന്ധിജി)|جینتی=ജയന്തി|چھوٹے=ചെറിയ|آخر=ഒടുവിൽ|ملی=കിട്ടി|کلاس=ക്ലാസ്|سنیں=കേൾക്കും|آداب=നമസ്കാരം|ٹھیک=സുഖം/ശരി|لیجیے=ഇതാ എടുക്കൂ|وہی=അതേ|چاہیے=വേണം|کیوں=എന്തുകൊണ്ട്|کیسے=എങ്ങനെ|بابائے=രാഷ്ട്രപിതാവ്|قوم=രാജ്യം|دن=ദിവസം|ہفتے=ആഴ്ച|مہینے=മാസം|اکتوبر=ഒക്ടോബർ|اتوار=ഞായർ|پیر=തിങ്കൾ|منگل=ചൊവ്വ|بدھ=ബുധൻ|جمعرات=വ്യാഴം|جمعہ=വെള്ളി|سنیچر=ശനി|دیکھ=കണ്ട്|اُدھر=അങ്ങോട്ട്|اِدھر=ഇങ്ങോട്ട്|پیارے=പ്രിയപ്പെട്ട").split('|').forEach(p=>{const[a,b]=p.split('=');G[norm(a)]=b});
function words(t){return t.split(' ').map(w=>{const m=G[norm(w)];return `<span class="w${m?' gl':''}" data-w="${w}" data-m="${m||''}" tabindex="0">${w}</span>`}).join(' ')}
document.addEventListener('click',e=>{const w=e.target.closest('.w');if(!w)return;
 document.querySelectorAll('.w.k').forEach(x=>x.classList.remove('k'));w.classList.add('k');
 const p=$('#pop');p.innerHTML=`<div class="ur">${w.dataset.w.replace(/[۔!؟]/g,'')}</div><div class="ml">${w.dataset.m||'ഉച്ചരിച്ച് കേൾക്കൂ 🔊'}</div>`;p.style.display='block';clearTimeout(p.t);p.t=setTimeout(()=>p.style.display='none',3500);
 say(w.dataset.w,.7)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('w'))e.target.click()});
function cheer(){const a=['⭐','🎉','✏️','🌟','👏'];for(let i=0;i<7;i++){const s=document.createElement('span');s.className='pop';s.textContent=a[i%5];s.style.left=(15+Math.random()*70)+'vw';s.style.top=(50+Math.random()*30)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
/* ---------- tabs ---------- */
const tabs=[['story','📖 کہانی','കഥ'],['role','🎭 رول پلے','റോൾ പ്ലേ'],['leaders','🇮🇳 لیڈر','നേതാക്കൾ'],['cal','📅 کیلنڈر','കലണ്ടർ'],['num','🔢 گنتی اور ٹکٹ','അക്കം & സ്റ്റാമ്പ്'],['quiz','🏆 کوئز','ക്വിസ്']];
tabs.forEach(([id,u,m],i)=>{const b=el(`<button role="tab" aria-selected="${i==0}" data-t="${id}"><span class="ur" style="line-height:1.5">${u}</span> <span class="ml">${m}</span></button>`);
 b.onclick=()=>{speechSynthesis.cancel();document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x==b));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==id));window.scrollTo(0,0)};$('#nav').appendChild(b)});
$('#story').classList.add('on');
/* ---------- STORY ---------- */
const S=[
['آج گاندھی جینتی ہے۔','ഇന്ന് ഗാന്ധി ജയന്തിയാണ്.'],
['ٹیچر کلاس میں آئی۔ بچّوں سے کہنے لگیں۔','ടീച്ചർ ക്ലാസിൽ വന്നു. കുട്ടികളോട് പറഞ്ഞു.'],
['بچّو! آج ہم گاندھی جی کی ایک کہانی سنیں گے۔','കുട്ടികളേ! ഇന്ന് നമ്മൾ ഗാന്ധിജിയുടെ ഒരു കഥ കേൾക്കും.'],
['کاکا کالیلکر گاندھی جی کے دوست تھے۔','കാകാ കാലേൽകർ ഗാന്ധിജിയുടെ സുഹൃത്തായിരുന്നു.'],
['ایک دن وہ گاندھی جی سے ملنے آئے۔','ഒരു ദിവസം അദ്ദേഹം ഗാന്ധിജിയെ കാണാൻ വന്നു.'],
['اس وقت گاندھی جی اِدھر اُدھر کچھ تلاش کر رہے تھے۔','അപ്പോൾ ഗാന്ധിജി അങ്ങിങ്ങ് എന്തോ തിരയുകയായിരുന്നു.'],
['باپو! آپ کیا تلاش کر رہے ہیں؟','ബാപ്പു! നിങ്ങൾ എന്താണ് തിരയുന്നത്?'],
['کاکا! میری ایک پنسل گُم ہو گئی ہے۔','കാകാ! എന്റെ ഒരു പെൻസിൽ നഷ്ടപ്പെട്ടു.'],
['باپو! یہ لیجیے میری پنسل!','ബാപ്പു! ഇതാ എന്റെ പെൻസിൽ എടുക്കൂ!'],
['نہیں کاکا! مجھے وہی پنسل چاہیے۔','വേണ്ട കാകാ! എനിക്ക് ആ പെൻസിൽ തന്നെ വേണം.'],
['باپو جی کی پریشانی دیکھ کر کاکا بھی پنسل تلاش کرنے لگے۔','ബാപ്പുജിയുടെ വിഷമം കണ്ട് കാകായും പെൻസിൽ തിരയാൻ തുടങ്ങി.'],
['آخر ایک کتاب کے اندر سے پنسل ملی۔','ഒടുവിൽ ഒരു പുസ്തകത്തിനുള്ളിൽ നിന്ന് പെൻസിൽ കിട്ടി.'],
['پنسل پا کر گاندھی جی بہت خوش ہوئے۔','പെൻസിൽ കിട്ടിയപ്പോൾ ഗാന്ധിജി വളരെ സന്തോഷിച്ചു.'],
['ان کی خوشی دیکھ کر کاکا نے پوچھا۔','അദ്ദേഹത്തിന്റെ സന്തോഷം കണ്ട് കാകാ ചോദിച്ചു.'],
['باپو! اس پنسل کی کیا خاص بات ہے؟','ബാപ്പു! ഈ പെൻസിലിന് എന്താണ് പ്രത്യേകത?'],
['گاندھی جی نے کہا۔','ഗാന്ധിജി പറഞ്ഞു.'],
['یہ پنسل میرے لیے ایک انمول تحفہ ہے!','ഈ പെൻസിൽ എനിക്ക് ഒരു അമൂല്യ സമ്മാനമാണ്!'],
['وہ کیسے باپو؟','അത് എങ്ങനെ ബാപ്പു?'],
['پیارے کاکا! یہ ایک چھوٹے بچّے کا تحفہ ہے۔','പ്രിയ കാകാ! ഇത് ഒരു ചെറിയ കുട്ടിയുടെ സമ്മാനമാണ്.'],
['اس نے بڑے پیار سے مجھے دیا تھا۔','അവൻ വലിയ സ്നേഹത്തോടെ എനിക്ക് തന്നതാണ്.'],
['میرے لیے یہ پنسل بہت قیمتی ہے۔','എനിക്ക് ഈ പെൻസിൽ വളരെ വിലപ്പെട്ടതാണ്.']];
(()=>{const r=$('#story');
 r.innerHTML=`<div class="card"><h2 class="title ur">انمول تحفہ</h2><p style="text-align:center;margin:0" class="ml">അമൂല്യ സമ്മാനം · ഏതെങ്കിലും വാക്കിൽ തൊട്ടാൽ അർത്ഥം + ഉച്ചാരണം കേൾക്കാം (ചുവന്ന കുത്തുള്ളവയ്ക്ക് അർത്ഥം ഉണ്ട്)</p>
 <p style="text-align:center"><button class="btn" id="all">▶ پوری کہانی سنیے · മുഴുവൻ കേൾക്കൂ</button> <button class="btn alt" id="stop">⏹</button> <label class="ml"><input type="checkbox" id="showml" checked> മലയാളം</label></p></div><div class="card" id="sl"></div>`;
 const sl=$('#sl');S.forEach(([u,m],i)=>{sl.appendChild(el(`<div class="line" id="L${i}"><button class="btn sm" aria-label="listen">🔊</button><div class="txt"><div class="ur">${words(u)}</div><div class="ml mm">${m}</div></div></div>`));
  sl.lastChild.querySelector('button').onclick=()=>say(u)});
 $('#showml').onchange=e=>document.querySelectorAll('.mm').forEach(x=>x.style.display=e.target.checked?'':'none');
 let stopF=false;$('#stop').onclick=()=>{stopF=true;speechSynthesis.cancel()};

/* ---------- ROLE PLAY ---------- */
